name: Installer la base Supabase (une seule fois)

on:
  workflow_dispatch:
    inputs:
      confirmer:
        description: 'Tape OUI : ce script EFFACE puis recrée les tables de l application'
        required: true
        default: 'NON'

jobs:
  install-db:
    name: Installer la base de données
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Vérifier la confirmation
        run: |
          if [ "${{ github.event.inputs.confirmer }}" != "OUI" ]; then
            echo "Arrêt : tape OUI dans le champ de confirmation."; exit 1
          fi

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer le projet (ZIP ou sous-dossier)
        run: |
          if [ ! -f supabase/TOUT-EN-UN.sql ]; then
            z=$(ls -1 *.zip 2>/dev/null | sort -V | tail -n1)
            if [ -n "$z" ]; then
              echo "ZIP trouvé : $z"
              unzip -oq "$z" -d _projet
            fi
            p=$(find . -maxdepth 5 -name TOUT-EN-UN.sql -path "*supabase*" | head -n1)
            if [ -z "$p" ]; then echo "ERREUR : supabase/TOUT-EN-UN.sql introuvable (ZIP v1.7.1 ou plus récent requis)."; exit 1; fi
            mkdir -p supabase && cp "$p" supabase/TOUT-EN-UN.sql
          fi
          ls -l supabase/TOUT-EN-UN.sql

      - name: Vérifier les secrets
        run: |
          for v in DB_HOST DB_USER DB_PASSWORD; do
            if [ -z "$(printenv $v)" ]; then echo "SECRET MANQUANT : $v"; exit 1; fi
          done
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

      - name: Exécuter le script SQL
        env:
          PGHOST: ${{ secrets.DB_HOST }}
          PGUSER: ${{ secrets.DB_USER }}
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
          PGPORT: '5432'
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          psql -v ON_ERROR_STOP=1 --single-transaction -f supabase/TOUT-EN-UN.sql
          echo "Base installée."
