name: Build KANIS VPN ACADEMY APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compiler l'APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Vérifier le site et le logo
        run: |
          test -f www/index.html
          test -f www/img/logo.png
          test -f www/img/logo-192.png
          test -f www/js/kanis-backend.js
          test -f www/js/config.js
          grep -q 'signInWithPassword' www/js/kanis-backend.js
          grep -q 'auth.signUp' www/js/kanis-backend.js
          grep -q 'auth.getSession' www/js/kanis-backend.js
          test -f scripts/patch-android.js
          grep -q "supabase.co" www/js/config.js
          ! grep -rn "sb_secret_" www/
          test -f resources/icon-only.png
          test -d resources/android-icons
          test -f resources/icon-foreground.png
          test -f resources/icon-background.png
          test -f resources/splash.png
          test -f resources/splash-dark.png

      - name: Installer les dépendances
        run: npm install

      - name: Copier supabase.js dans l'application (sans CDN)
        run: |
          npm run vendor
          test -f www/js/vendor/supabase.js

      - name: Créer le projet Android (Capacitor)
        run: npx cap add android

      - name: Ajouter le lien profond kanisvpn://auth-callback
        run: |
          node scripts/patch-android.js
          grep -q 'android:scheme="kanisvpn"' android/app/src/main/AndroidManifest.xml

      - name: Générer l'écran de démarrage depuis le logo
        run: npx capacitor-assets generate --android --assetPath resources
        continue-on-error: true

      - name: Installer l'icône KANIS (logo officiel)
        run: |
          node scripts/apply-icons.js
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Synchroniser le site avec Android
        run: npx cap sync android

      - name: Compiler l'APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KANIS-VPN-ACADEMY.apk

      - name: Publier l'APK dans les Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KANIS-VPN-ACADEMY-APK
          path: KANIS-VPN-ACADEMY.apk
          if-no-files-found: error
          retention-days: 30
